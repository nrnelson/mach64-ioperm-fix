Section "Device"
    Identifier "RageXL"
    Driver     "mach64"
    BusID      "PCI:0:6:0"
    #Option     "NoAccel" "true"
EndSection

Section "Monitor"
    Identifier  "Dell2007FP"
    HorizSync   30-83
    VertRefresh 56-76
    # VESA 1600x1200@60, 162 MHz
    Modeline "1600x1200_60" 162.00  1600 1664 1856 2160  1200 1201 1204 1250  +hsync +vsync
    # CVT-RB-like, 131 MHz: easier on the Rage XL DAC and memory bandwidth.
    # Timings nudged off exact CVT-RB so X does not reject it (EDID lacks RB flag).
    Modeline "1600x1200R"  131.00  1600 1656 1688 1768  1200 1203 1207 1235 +hsync -vsync
    Option "PreferredMode" "1600x1200"
EndSection

Section "Screen"
    Identifier   "Screen0"
    Device       "RageXL"
    Monitor      "Dell2007FP"
    # 24-bit caps pixel clock at ~125 MHz (memory bandwidth); 1600x1200@60 needs 162
    DefaultDepth 16
    SubSection "Display"
        Depth 24
        Modes "1600x1200R" "1600x1200"
        Virtual 1600 1200
    EndSubSection
    SubSection "Display"
        Depth 16
        Modes "1600x1200R" "1600x1200"
        Virtual 1600 1200
    EndSubSection
EndSection
